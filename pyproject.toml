[project]
name = "agent-bridge"
version = "0.1.0"
description = "Crash-safe shared session ledger for multi-agent setups"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
agent-bridge = "agent_bridge.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
